name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # pnpm sürümü package.json içindeki packageManager alanından okunur.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # API'nin OpenAPI belgesi değişip istemci (packages/api-client) yeniden üretilmediyse burada durur.
      # Düzeltmek için: pnpm gen:api, sonra üretilen dosyaları commit et (ADR-005).
      - name: API istemcisi güncel mi
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/api-client

      - name: Build
        run: pnpm build
